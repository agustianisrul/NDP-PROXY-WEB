<form [formGroup]="dashboardForm" (ngSubmit)="onSubmit()" class="w-full pb-4">
    <div class="flex items-center justify-between w-full gap-4">
        <!-- filter dashboard -->
        <div class="flex items-center gap-4 w-full md:w-auto">
            <label for="selectedDate" class="flex-shrink-0 font-semibold text-gray-700 min-w-[70px] text-right">
                Filter<span class="text-red-500">*</span>
            </label>

            <div class="flex flex-col w-full max-w-xs">
                <p-datepicker
                    formControlName="selectedDate"
                    selectionMode="range"
                    [readonlyInput]="true"
                    inputId="selectedDate"
                ></p-datepicker>

                @if (dashboardForm.controls['selectedDate']?.invalid) {
                <p-message severity="error" size="small" variant="simple"> Date is required. </p-message>
                }
            </div>

            <button pButton type="submit" label="Refresh" class="p-button-text" ></button>
        </div>

        <!-- <div class="ml-auto">
            <button pButton severity="secondary" type="submit" class="px-4">
                <span pButtonLabel>Submit</span>
            </button>
        </div> -->
    </div>
</form>
<div class="grid grid-cols-4 gap-8 pb-4">
    <app-statistic-widget label="Total Uploaded" [value]="dashboardData.totalUpload || 0" icon="pi pi-upload" color="blue" />
    <app-statistic-widget label="Total Downloaded" [value]="dashboardData.totalDownload || 0" icon="pi pi-download" color="red" />
    <app-statistic-widget label="Total Completed" [value]="dashboardData.totalComplete || 0" icon="pi pi-check-circle" color="green" />
    <app-statistic-widget label="Total Pending Upload" [value]="dashboardData.totalPending || 0" icon="pi pi-stop" color="green" />
</div>
<div class="grid grid-cols-2 gap-8">
    <app-table-universal
        [data]="dashboardData.fileList"
        dataKey="keyId"
        [columns]="columns"
        [mainTableButtons]="mainButtonList"
        [rowTableButtons]="actionButtonList"
        [reloadTrigger]="reloadTableData"
    />
    <app-dashboard-chart [type]="dashboardData.detail.length > 1 ? 'bar' : 'pie'" [data]="chartData" />    
</div>
