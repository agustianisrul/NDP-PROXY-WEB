<div class="w-full flex bg-white py-3 px-5 items-center rounded shadow mb-3">
    <p-breadcrumb [model]="breaditems" [home]="home" />
</div>
<form [formGroup]="reportLoggingForm" (ngSubmit)="onSubmit()" class="w-full pb-4">
    <div class="flex items-center justify-between w-full gap-4">
        <!-- filter dashboard -->
        <div class="flex items-center gap-4 w-full md:w-auto">
            <label for="selectedDate" class="flex-shrink-0 font-semibold text-gray-700 min-w-[70px] text-right">
                Filter<span class="text-red-500">*</span>
            </label>

            <div class="flex flex-col">
                <p-datepicker
                    formControlName="selectedDate"
                    selectionMode="range"
                    [readonlyInput]="true"
                    inputId="selectedDate"
                    dateFormat="yy-mm-dd"
                ></p-datepicker>

                @if (reportLoggingForm.controls['selectedDate']?.invalid) {
                <p-message severity="error" size="small" variant="simple"> Date is required. </p-message>
                }
            </div>
            <button pButton *appOnlyBrowser type="submit" label="Refresh" icon="pi pi-refresh" [loading]="loading"
                class="p-button-primary">
            </button>
        </div>
    </div>
</form>
<div class="grid grid-cols-2 gap-8">
    <app-table-universal
        [data]="data"
        [dataKey]="'idfileactivity'"
        [columns]="columns"
        [mainTableButtons]="mainButtonList"
        [rowTableButtons]="actionButtonList"
        [reloadTrigger]="reloadTableData"
        (rowTableButtonClick)="onRowTableButtonClick($event)"
        (mainTableButtonClick)="onMainTableButtonClick($event)"
        [(selectedRows)]="selectedRows"
    />
    <app-table-universal
        [data]="dataLogging"
        [dataKey]="'idfileactivity'"
        [columns]="columnsLogging"
        [rowTableButtons]="actionButtonLoggingList"
        [reloadTrigger]="reloadTableLoggingData"
    />
</div>
