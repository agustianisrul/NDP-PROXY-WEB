<div class="w-full flex bg-white py-3 px-5 items-center rounded shadow mb-3">
    <p-breadcrumb [model]="breaditems" [home]="home" />
</div>
<app-table-universal [url]="'/v2/menu/list-menu-role'" [dataKey]="'idMenu'" [columns]="columns"
    [mainTableButtons]="mainButtonList" [rowTableButtons]="actionButtonList" [(selectedRows)]="selectedRows"
    (mainTableButtonClick)="onMainTableButtonClick($event)" (rowTableButtonClick)="onRowTableButtonClick($event)"
    [reloadTrigger]="reloadTableData" (reloadComplete)="onReloadComplete()" />
<app-confirm-delete [selectedRows]="selectedRows" keyLabel="nameMenu" />
